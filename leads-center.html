<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>👥 מרכז לידים אחוד | אבי חזן</title>
<meta name="theme-color" content="#a05c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מרכז לידים">
<style>
  :root{
    --ink:#2b2118; --bg:#fbf4e9; --card:#fff; --line:#e6d9c2; --muted:#78624f;
    --terra:#c1764c; --terra-d:#a05c3a; --brown:#4a382b;
    --rent:#2e7d32; --rent-bg:#e9f5ec; --buy:#2c6ca5; --buy-bg:#e6f1fb;
    --red:#c0392b; --amber:#e08e0b; --shadow:0 2px 12px rgba(74,56,43,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{background:var(--bg);color:var(--brown);line-height:1.55;padding:0 0 90px;-webkit-tap-highlight-color:transparent;}
  header{background:linear-gradient(135deg,var(--brown),var(--terra-d));color:#fff;padding:18px 16px 14px;text-align:center;box-shadow:var(--shadow);}
  header h1{font-size:21px;} header p{font-size:12px;opacity:.9;margin-top:2px;}
  .wrap{max-width:860px;margin:0 auto;padding:14px;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:9px;font-size:14px;font-weight:bold;color:var(--terra-d);cursor:pointer;text-align:center;}
  .tab.active{background:var(--terra);color:#fff;}
  .panel{display:none;} .panel.active{display:block;}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .sumcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 5px;text-align:center;box-shadow:var(--shadow);}
  .sumcard .n{font-size:19px;font-weight:bold;} .sumcard .l{font-size:10.5px;color:var(--muted);}
  .n.rent{color:var(--rent);} .n.buy{color:var(--buy);} .n.hot{color:var(--red);} .n.all{color:var(--terra-d);}
  .btn{border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:bold;cursor:pointer;color:#fff;background:var(--terra);font-family:inherit;}
  .btn:active{transform:scale(.97);}
  .btn.sm{padding:5px 10px;font-size:12px;} .btn.gray{background:#8a7a68;} .btn.green{background:var(--rent);} .btn.blue{background:var(--buy);} .btn.red{background:var(--red);} .btn.wa{background:#25d366;} .btn.wide{width:100%;margin-top:7px;}
  .bar{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
  input,select,textarea{padding:9px;border:1px solid #d8c8ad;border-radius:9px;font-family:inherit;font-size:14px;background:#fff;width:100%;}
  .filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .filters select,.filters input{max-width:180px;} .filters input{flex:1;min-width:130px;max-width:none;}
  .lead{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow);border-right:5px solid var(--rent);}
  .lead.buy{border-right-color:var(--buy);}
  .lead h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap;}
  .lead .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .typebadge{font-size:11px;font-weight:bold;padding:3px 11px;border-radius:20px;cursor:pointer;border:none;}
  .tb-rent{background:var(--rent-bg);color:var(--rent);} .tb-buy{background:var(--buy-bg);color:var(--buy);}
  .pill{display:inline-block;font-size:10.5px;font-weight:bold;padding:2px 8px;border-radius:20px;background:#f0eadf;color:var(--muted);}
  .hot{color:var(--red);}
  .lrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;padding:14px;overflow:auto;} .ov.show{display:block;}
  .modal{max-width:520px;margin:20px auto;background:var(--card);border-radius:16px;padding:17px;box-shadow:0 12px 50px rgba(0,0,0,.35);}
  .modal .x{float:left;background:var(--red);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--muted);margin:7px 0 3px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .obj{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
  .obj b{color:var(--terra-d);font-size:14.5px;} .obj p{font-size:13px;margin-top:5px;color:#5a4a3a;}
  .hint{font-size:12px;color:var(--muted);background:#fff7e8;border:1px solid #f0e0bf;border-radius:10px;padding:9px 12px;margin-bottom:12px;}
  .seg{display:flex;gap:6px;margin-bottom:12px;}
  .seg button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:bold;font-size:13px;cursor:pointer;color:var(--muted);}
  .seg button.on{background:var(--terra);color:#fff;border-color:var(--terra);}
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:99999;display:flex;gap:6px;font-family:Arial,sans-serif">
<a href="https://avi7756-design.github.io/avi-sites/maestro-nadlan.html" style="background:#4ea1ff;color:#06121f;text-decoration:none;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700">🏠 ראשי</a>
<button onclick="history.back()" style="background:#222d3d;color:#fff;border:1px solid #2e3c4f;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer">◀</button>
<button onclick="history.forward()" style="background:#222d3d;color:#fff;border:1px solid #2e3c4f;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer">▶</button>
</div>
<header>
  <h1>👥 מרכז לידים אחוד</h1>
  <p>השכרה ורכישה · עובד ידנית · ללא n8n</p>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-p="leads" onclick="tab('leads')">👥 לידים</div>
    <div class="tab" data-p="analysis" onclick="tab('analysis')">📊 ניתוח</div>
    <div class="tab" data-p="obj" onclick="tab('obj')">🧠 התנגדויות</div>
  </div>

  <!-- לידים -->
  <div class="panel active" id="leads">
    <div class="summary" id="summary"></div>
    <div class="bar">
      <button class="btn" onclick="openAdd()">➕ ליד חדש</button>
      <button class="btn gray" onclick="exportData()">📤 גיבוי</button>
    </div>
    <div class="filters">
      <input id="q" placeholder="🔍 שם / טלפון / הערה" oninput="renderLeads()">
      <select id="fType" onchange="renderLeads()"><option value="">הכל (השכרה+רכישה)</option><option value="rent">🔑 השכרה</option><option value="buy">🏢 רכישה</option></select>
      <select id="fStatus" onchange="renderLeads()"><option value="">כל הסטטוסים</option></select>
    </div>
    <div id="list"></div>
  </div>

  <!-- ניתוח -->
  <div class="panel" id="analysis">
    <div class="hint">ניתוח אוטומטי של הלידים - מאיפה הם מגיעים, איכות, ומה הסטטוס. מתעדכן לבד.</div>
    <div id="analysisBody"></div>
  </div>

  <!-- התנגדויות -->
  <div class="panel" id="obj">
    <div class="hint">ספר תשובות מומחה. בחר השכרה או רכישה - לכל אחד ההתנגדויות שלו והתשובה שעובדת.</div>
    <div class="seg"><button id="segR" class="on" onclick="objMode('rent')">🔑 השכרה</button><button id="segB" onclick="objMode('buy')">🏢 רכישה</button></div>
    <div id="objList"></div>
  </div>

  <footer>מרכז לידים אחוד · v1.0 · נשמר מקומית · אבי חזן</footer>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:11px 22px;border-radius:30px;font-weight:bold;opacity:0;transition:.3s;z-index:200">נשמר ✓</div>

<script>
var KEY='leads_center_v1';
var ST_RENT=['פנייה חדשה','דיברנו','ביקור נקבע','ביקר','מעוניין','סגרנו','לא מתאים'];
var ST_BUY=['חדש','בבדיקה','משא ומתן','להתקדם','נסגר','נדחה'];
var SRCS=['פייסבוק קבוצות','פייסבוק','יד2','מדלן','המלצה','כונס נכסים','מתווך','אחר'];
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){return (s||'').replace(/[<>&"]/g,function(c){return({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c];});}
function toast(t){var e=document.getElementById('toast');e.textContent=t||'נשמר ✓';e.style.opacity='1';setTimeout(function(){e.style.opacity='0';},1400);}

var SEED=[
 ["סער","055-9266356","פייסבוק קבוצות","דיברנו","גבוה","ביקור במקום מעוניין לסגור מיידית"],
 ["שגיא","+972 50-656-5206","פייסבוק קבוצות","פנייה חדשה","בינוני",""],
 ["חגית","0506301616","אחר","ביקר","בינוני","בקשר לבן שלה, זוג צעיר מרפאל, לא התווכחה על המחיר"],
 ["לירן","0547696616","פייסבוק קבוצות","דיברנו","בינוני","גר בחיפה עובד בחוצות, מעוניין לבקר"],
 ["חנה","+972 52-518-5006","פייסבוק קבוצות","דיברנו","גבוה","ביקשה חומר שלחתי, ליצור קשר"],
 ["רן בן בכה","0506705556","פייסבוק קבוצות","דיברנו","גבוה","עובד באולם אירועים, גר לבד, כניסה מיידית"],
 ["שמעון","+972 52-539-1339","פייסבוק קבוצות","דיברנו","גבוה","פנסיונר מוכר דירה קונה בקפריסין"],
 ["עליזה","+972 54-363-7787","פייסבוק קבוצות","דיברנו","בינוני","דירה בגדוד העברי, מתלבטת"],
 ["שחר","+972 53-621-5085","פייסבוק קבוצות","לא מתאים","נמוך","מחפש 2 דירות צמודות"],
 ["סעיד","058-6555343","פייסבוק קבוצות","ביקר","גבוה","זוג בעל מסעדה רוצה לבקר"],
 ["אדם","058-7378835","פייסבוק קבוצות","דיברנו","בינוני","זוג רוצה 3500"],
 ["עופר","050-6842913","יד2","דיברנו","בינוני","נשמע מקוטע"],
 ["אוראל","+972 50-444-5027","פייסבוק קבוצות","דיברנו","גבוה","יגיע לביקור, מרפאל"],
 ["נטלי","0584170184","פייסבוק קבוצות","דיברנו","נמוך","פקידה במלונית, מזומן מוגבל"],
 ["מאור","0549174781","פייסבוק קבוצות","סגרנו","גבוה","חתם חוזה 13.6.26 - הדירה הושכרה לו"],
 ["דיאנה","16476066911","פייסבוק קבוצות","לא מתאים","נמוך","מקנדה, מחפשת 3 חדרים"],
 ["מוטי","0587698772","פייסבוק קבוצות","פנייה חדשה","בינוני","מבקש מידע"],
 ["יהודית","0555587120","פייסבוק קבוצות","פנייה חדשה","בינוני","שואלת כמה מטר"],
 ["שלומי בן עמרם","0506280182","פייסבוק קבוצות","פנייה חדשה","בינוני","שואל על 4 חדרים"],
 ["קלודיו","+972 53-789-6713","פייסבוק","לא מתאים","בינוני","רק באוקטובר, לא מתאים בגודל ותאריך"],
 ["נטלי (2)","0584170184","אחר","פנייה חדשה","בינוני","במלונית, מזומן 3200"],
 ["יוטי","0525819522","אחר","דיברנו","בינוני","בעל נגריה לעובד שלו"],
 ["מנחם גוטמן","0534586324","אחר","פנייה חדשה","בינוני",""],
 ["יפית","0547306997","פייסבוק קבוצות","פנייה חדשה","בינוני","לא עונה צריך מענה"],
 ["אליאורדנן","0552716585","פייסבוק קבוצות","דיברנו","נמוך","המטבח קטן רוצה גדולה יותר"],
 ["תומר","0525205163","פייסבוק קבוצות","דיברנו","נמוך","הדירה קטנה מידי"],
 ["חגית (2)","05322104059","פייסבוק קבוצות","לא מתאים","נמוך","הדירה קטנה"],
 ["לברר","+972 52-375-9862","אחר","פנייה חדשה","בינוני",""],
 ["ירון","0523759862","פייסבוק קבוצות","דיברנו","גבוה","קיבל פרטים, ביקש להמתין בגלל המצב"],
 ["אילנה לוזון","0528802660","פייסבוק קבוצות","לא מתאים","נמוך","עבור הבת, תקציב 2000"],
 ["מור","0505696072","פייסבוק","דיברנו","בינוני","זוג, מעוניין לבקר, מחכה לאשתו"],
 ["לירן (גרוש)","052-7279698","פייסבוק קבוצות","מעוניין","גבוה","ראה הדירה, עקרונית 3600+שנתיים"],
 ["רותי שושן","0535244652","פייסבוק קבוצות","פנייה חדשה","בינוני","שלחתי חומר, להתקשר"],
 ["יהודה","0526067073","פייסבוק קבוצות","פנייה חדשה","בינוני","קיבל מידע ודואר פרסומי"],
 ["ישראל","0529406767","פייסבוק קבוצות","לא מתאים","בינוני","מחפש 3 חדרים"],
 ["אלון","0544263353","פייסבוק קבוצות","לא מתאים","נמוך","בחוזה קיים, לא רלוונטי"]
];
function seedIfEmpty(){
  var a=load();
  if(a)return a;
  a=SEED.map(function(s){return {id:uid(),name:s[0],phone:s[1],type:'rent',source:s[2],status:s[3],potential:s[4],notes:s[5],createdAt:new Date().toISOString()};});
  save(a);return a;
}
function getLeads(){return load()||seedIfEmpty();}

function tab(p){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.p===p);});document.querySelectorAll('.panel').forEach(function(x){x.classList.toggle('active',x.id===p);});if(p==='analysis')renderAnalysis();if(p==='obj')renderObj();}

function renderLeads(){
  var a=getLeads();
  var rent=a.filter(function(l){return l.type!=='buy';}).length;
  var buy=a.filter(function(l){return l.type==='buy';}).length;
  var hot=a.filter(function(l){return l.potential==='גבוה'&&['לא מתאים','סגרנו','נדחה','נסגר'].indexOf(l.status)<0;}).length;
  document.getElementById('summary').innerHTML=
    sc(a.length,'all','סה"כ')+sc(rent,'rent','🔑 השכרה')+sc(buy,'buy','🏢 רכישה')+sc(hot,'hot','🔥 חמים');
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var ft=document.getElementById('fType').value, fs=document.getElementById('fStatus').value;
  var html=a.map(function(l,i){return {l:l,i:i};}).filter(function(x){
    var l=x.l;
    if(ft==='rent'&&l.type==='buy')return false;
    if(ft==='buy'&&l.type!=='buy')return false;
    if(fs&&l.status!==fs)return false;
    if(q){var h=((l.name||'')+' '+(l.phone||'')+' '+(l.notes||'')).toLowerCase();if(h.indexOf(q)<0)return false;}
    return true;
  }).map(function(x){
    var l=x.l,i=x.i,buy=l.type==='buy';
    var tel=(l.phone||'').replace(/[^0-9]/g,'');var wa=tel.replace(/^0/,'972');
    var hotMark=(l.potential==='גבוה'&&['לא מתאים','סגרנו','נדחה','נסגר'].indexOf(l.status)<0)?' 🔥':'';
    return '<div class="lead'+(buy?' buy':'')+'">'+
      '<h3>'+esc(l.name)+hotMark+' <button class="typebadge '+(buy?'tb-buy':'tb-rent')+'" onclick="toggleType('+i+')">'+(buy?'🏢 רכישה':'🔑 השכרה')+' ⇄</button></h3>'+
      '<div class="meta">📞 '+esc(l.phone||'')+' · '+esc(l.source||'')+' · <span class="pill">'+esc(l.status||'')+'</span> · '+esc(l.potential||'')+'</div>'+
      (l.notes?'<div class="meta" style="margin-top:4px">'+esc(l.notes)+'</div>':'')+
      '<div class="lrow">'+
        (tel?'<a class="btn sm blue" href="tel:'+tel+'">📞 חייג</a><a class="btn sm wa" href="https://wa.me/'+wa+'" target="_blank">💬 וואטסאפ</a>':'')+
        '<button class="btn sm gray" onclick="openEdit('+i+')">✏️ ערוך</button>'+
      '</div>'+
    '</div>';
  }).join('');
  document.getElementById('list').innerHTML=html||'<div class="hint" style="text-align:center">אין לידים תואמים.</div>';
}
function sc(n,c,l){return '<div class="sumcard"><div class="n '+c+'">'+n+'</div><div class="l">'+l+'</div></div>';}

function toggleType(i){var a=getLeads();a[i].type=(a[i].type==='buy')?'rent':'buy';
  var valid=(a[i].type==='buy')?ST_BUY:ST_RENT; if(valid.indexOf(a[i].status)<0)a[i].status=valid[0];
  save(a);renderLeads();toast(a[i].type==='buy'?'סומן כרכישה':'סומן כהשכרה');}

function openAdd(){form(null);}
function openEdit(i){form(i);}
function form(i){
  var a=getLeads();var l=(i!==null)?a[i]:{name:'',phone:'',type:'rent',source:'פייסבוק קבוצות',status:'פנייה חדשה',potential:'בינוני',notes:''};
  var stOpts=(l.type==='buy'?ST_BUY:ST_RENT);
  document.getElementById('modal').innerHTML=
   '<button class="x" onclick="closeOv()">✕</button><h2 style="color:var(--terra-d)">'+(i!==null?'✏️ עריכת ליד':'➕ ליד חדש')+'</h2>'+
   '<label>סוג</label><div class="seg"><button id="ty_rent" class="'+(l.type!=='buy'?'on':'')+'" onclick="setType(\'rent\')">🔑 השכרה</button><button id="ty_buy" class="'+(l.type==='buy'?'on':'')+'" onclick="setType(\'buy\')">🏢 רכישה</button></div>'+
   '<input type="hidden" id="f_type" value="'+(l.type||'rent')+'">'+
   '<label>שם</label><input id="f_name" value="'+esc(l.name)+'">'+
   '<label>טלפון</label><input id="f_phone" value="'+esc(l.phone||'')+'">'+
   '<div class="row2"><div><label>מקור</label><select id="f_source">'+opts(SRCS,l.source)+'</select></div>'+
   '<div><label>פוטנציאל</label><select id="f_pot">'+opts(['גבוה','בינוני','נמוך'],l.potential)+'</select></div></div>'+
   '<label>סטטוס</label><select id="f_status">'+opts(stOpts,l.status)+'</select>'+
   '<label>הערות</label><textarea id="f_notes" style="min-height:50px">'+esc(l.notes||'')+'</textarea>'+
   '<button class="btn wide" onclick="saveLead('+(i!==null?i:'-1')+')">💾 שמור</button>'+
   (i!==null?'<button class="btn red wide" onclick="delLead('+i+')">🗑️ מחק</button>':'');
  document.getElementById('ov').classList.add('show');
}
function setType(t){document.getElementById('f_type').value=t;document.getElementById('ty_rent').classList.toggle('on',t==='rent');document.getElementById('ty_buy').classList.toggle('on',t==='buy');
  var sel=document.getElementById('f_status');var cur=sel.value;sel.innerHTML=opts(t==='buy'?ST_BUY:ST_RENT,cur);}
function opts(arr,cur){return arr.map(function(o){return '<option'+(o===(cur||'').trim()?' selected':'')+'>'+o+'</option>';}).join('');}
function gv(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function saveLead(i){
  var a=getLeads();
  var l={id:(i>-1&&a[i])?a[i].id:uid(),type:gv('f_type'),name:gv('f_name')||'ליד',phone:gv('f_phone'),source:gv('f_source'),status:gv('f_status'),potential:gv('f_pot'),notes:gv('f_notes'),createdAt:(i>-1&&a[i])?a[i].createdAt:new Date().toISOString()};
  if(i>-1)a[i]=l;else a.unshift(l);
  save(a);closeOv();renderLeads();toast();
}
function delLead(i){if(!confirm('למחוק את הליד?'))return;var a=getLeads();a.splice(i,1);save(a);closeOv();renderLeads();}
function closeOv(){document.getElementById('ov').classList.remove('show');}
function exportData(){var d=localStorage.getItem(KEY)||'[]';var b=new Blob([d],{type:'application/json'});var u=URL.createObjectURL(b);var el=document.createElement('a');el.href=u;el.download='leads_center_backup_'+new Date().toISOString().slice(0,10)+'.json';el.click();}

function renderAnalysis(){
  var a=getLeads();
  function block(title,arr){
    var bySrc={},byStat={};
    arr.forEach(function(l){var s=l.source||'אחר';bySrc[s]=(bySrc[s]||0)+1;var st=l.status||'?';byStat[st]=(byStat[st]||0)+1;});
    var hot=arr.filter(function(l){return l.potential==='גבוה';}).length;
    var src=Object.entries(bySrc).sort(function(a,b){return b[1]-a[1];}).map(function(e){return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span>'+esc(e[0])+'</span><b>'+e[1]+'</b></div>';}).join('');
    var stat=Object.entries(byStat).sort(function(a,b){return b[1]-a[1];}).map(function(e){return '<span class="pill" style="margin:2px">'+esc(e[0])+': '+e[1]+'</span>';}).join('');
    return '<div class="obj"><b>'+title+' ('+arr.length+')</b><p>🔥 פוטנציאל גבוה: '+hot+'</p><div style="margin-top:6px"><b style="font-size:12px;color:var(--muted)">לפי מקור:</b>'+(src||'-')+'</div><div style="margin-top:6px"><b style="font-size:12px;color:var(--muted)">לפי סטטוס:</b><br>'+(stat||'-')+'</div></div>';
  }
  document.getElementById('analysisBody').innerHTML=
    block('🔑 לידים להשכרה',a.filter(function(l){return l.type!=='buy';}))+
    block('🏢 לידים לרכישה',a.filter(function(l){return l.type==='buy';}));
}

function objMode(m){objCur=m;document.getElementById('segR').classList.toggle('on',m==='rent');document.getElementById('segB').classList.toggle('on',m==='buy');renderObj();}
