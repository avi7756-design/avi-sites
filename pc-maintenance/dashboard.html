<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AviPC Care</title>
<script src="health-data.js"></script>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-text:#006300;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926;
    --good-text:#0ca30c;
  }
}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:24px;max-width:1080px;margin:0 auto}
h1{font-size:22px;font-weight:700}
h2{font-size:15px;font-weight:600;color:var(--ink2);margin-bottom:10px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
header{display:flex;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  padding:16px 18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
.tile .label{font-size:13px;color:var(--ink2)}
.tile .value{font-size:30px;font-weight:700;margin-top:2px}
.tile .value small{font-size:15px;font-weight:400;color:var(--muted)}
.tile .note{font-size:12px;color:var(--muted);margin-top:4px}
.meter{height:6px;border-radius:3px;background:var(--grid);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.hero{display:flex;align-items:center;gap:14px}
.hero .num{font-size:44px;font-weight:700;line-height:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  padding:4px 10px;border-radius:999px;border:1px solid var(--ring)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--grid)}
.alert:last-child{border-bottom:0}
.alert .ic{font-size:16px;line-height:1.4}
.alert .lvl{font-size:12px;font-weight:700}
.alert .fix{font-size:13px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:500;font-size:12px;
  border-bottom:1px solid var(--baseline);padding:4px 0}
td{padding:5px 0;border-bottom:1px solid var(--grid);
  font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
.empty{max-width:560px;margin:60px auto;text-align:center}
.empty code{background:var(--surface);border:1px solid var(--ring);border-radius:6px;
  padding:2px 8px;direction:ltr;display:inline-block;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const H = window.HEALTH_DATA;
const app = document.getElementById('app');

const ALERT_TEXT = {
  DISK_LOW:      v=>['נשארו רק '+v+' GB פנויים בכונן C:', 'הרץ את סקריפט התחזוקה, מחק קבצים גדולים שאינם נחוצים, או העבר תיקיות כבדות לכונן חיצוני/ענן.'],
  RAM_HIGH:      v=>['הזיכרון (RAM) בשימוש של '+v+'%', 'סגור תוכנות וטאבים שאינם בשימוש. אם זה קורה כל יום — שקול הרחבת זיכרון.'],
  CPU_HIGH:      v=>['המעבד עמוס ('+v+'%)', 'בדוק בטבלת התהליכים למטה מי צורך הכי הרבה, וסגור מה שלא נחוץ.'],
  UPTIME_LONG:   v=>['המחשב לא הופעל מחדש כבר '+v+' ימים', 'הפעלה מחדש משחררת זיכרון ומתקינה עדכונים. מומלץ לבצע היום.'],
  REBOOT_PENDING:()=>['ממתין להפעלה מחדש לסיום עדכון Windows', 'בצע הפעלה מחדש — עד אז המחשב עלול להיות איטי יותר.'],
  STARTUP_MANY:  v=>[v+' תוכנות עולות אוטומטית עם ההדלקה', 'פתח מנהל המשימות ← "אפליקציות הפעלה" ובטל את מה שלא חיוני. זה המאיץ מספר 1 להדלקה.'],
  RAM_SMALL:     v=>['במחשב יש רק '+v+' GB זיכרון', 'לשימוש שוטף היום מומלץ 16 GB. הרחבת זיכרון היא השדרוג המשתלם ביותר.'],
  MAINT_NEVER:   ()=>['תחזוקה אוטומטית עדיין לא רצה', 'היא תרוץ ביום ראשון הקרוב בשעה 09:00, או הרץ ידנית את Maintenance.ps1.'],
  MAINT_OLD:     ()=>['התחזוקה האחרונה רצה לפני יותר משבועיים', 'ודא שהמחשב דולק בימי ראשון בבוקר, או הרץ ידנית את Maintenance.ps1.']
};
const LEVEL = {
  critical:{ic:'⛔', name:'קריטי',  color:'var(--crit)'},
  warning: {ic:'⚠️', name:'אזהרה', color:'var(--warn)'},
  good:    {ic:'✅', name:'תקין',  color:'var(--good)'}
};

if (!H) {
  app.innerHTML = `<div class="empty">
    <h1>הדשבורד עדיין לא קיבל נתונים</h1>
    <p class="sub" style="margin:14px 0">קובץ health-data.js לא נמצא ליד הדשבורד.
    הרץ פעם אחת את בדיקת הבריאות ורענן את הדף:</p>
    <code>powershell -ExecutionPolicy Bypass -File HealthCheck.ps1</code>
  </div>`;
} else {
  const score = H.score, sysDisk = (H.disks||[]).find(d=>d.drive==='C:') || (H.disks||[])[0];
  const status = score>=85 ? LEVEL.good : score>=60 ? LEVEL.warning : LEVEL.critical;
  const statusWord = score>=85 ? 'המחשב במצב טוב' : score>=60 ? 'יש נקודות לטיפול' : 'נדרש טיפול דחוף';
  const meterColor = p => p>=90?'var(--crit)':p>=80?'var(--serious)':'var(--s1)';
  const upDays = (H.uptimeHours/24);

  const alertsHtml = (H.alerts||[]).length ? (H.alerts||[]).map(a=>{
    const [txt,fix] = (ALERT_TEXT[a.code]||(v=>[a.code,'']))(a.value);
    const L = LEVEL[a.level]||LEVEL.warning;
    return `<div class="alert"><span class="ic">${L.ic}</span><div>
      <span class="lvl" style="color:${L.color}">${L.name}</span> — ${txt}
      <div class="fix">💡 ${fix}</div></div></div>`;
  }).join('') : `<div class="alert"><span class="ic">✅</span><div>לא נמצאו בעיות. המשך כרגיל.</div></div>`;

  const ramRows = (H.topRam||[]).map(p=>`<tr><td>${p.name}</td><td>${p.mb.toLocaleString()} MB</td></tr>`).join('');
  const cpuRows = (H.topCpu||[]).map(p=>`<tr><td>${p.name}</td><td>${p.sec.toLocaleString()} שניות</td></tr>`).join('');

  app.innerHTML = `
  <header>
    <div>
      <h1>AviPC Care — מרכז הבקרה של המחשב</h1>
      <div class="sub">${H.computerName} · ${H.osCaption||''} · עודכן: ${H.generatedAt}</div>
    </div>
    <div class="hero card" style="margin:0">
      <div class="num">${score}<small style="font-size:16px;color:var(--muted)">/100</small></div>
      <div><span class="badge">${status.ic} ${statusWord}</span>
        <div class="sub">ציון בריאות כללי</div></div>
    </div>
  </header>

  <div class="card"><h2>התראות והמלצות לפעולה</h2>${alertsHtml}</div>

  <div class="grid">
    <div class="tile"><div class="label">מעבד (CPU)</div>
      <div class="value">${H.cpuPct}<small>%</small></div>
      <div class="meter"><i style="width:${H.cpuPct}%;background:${meterColor(H.cpuPct)}"></i></div>
      <div class="note">${(H.cpuName||'').trim()}</div></div>
    <div class="tile"><div class="label">זיכרון (RAM)</div>
      <div class="value">${H.ram.usedPct}<small>%</small></div>
      <div class="meter"><i style="width:${H.ram.usedPct}%;background:${meterColor(H.ram.usedPct)}"></i></div>
      <div class="note">${H.ram.usedGB} מתוך ${H.ram.totalGB} GB בשימוש</div></div>
    <div class="tile"><div class="label">כונן ${sysDisk?sysDisk.drive:''} — פנוי</div>
      <div class="value">${sysDisk?sysDisk.freeGB:'?'}<small> GB</small></div>
      <div class="meter"><i style="width:${sysDisk?100-sysDisk.freePct:0}%;background:${meterColor(sysDisk?100-sysDisk.freePct:0)}"></i></div>
      <div class="note">${sysDisk?sysDisk.freePct:'?'}% פנוי מתוך ${sysDisk?sysDisk.totalGB:'?'} GB</div></div>
    <div class="tile"><div class="label">זמן מאז הפעלה מחדש</div>
      <div class="value">${upDays<1?Math.round(H.uptimeHours)+'<small> שעות</small>':upDays.toFixed(1)+'<small> ימים</small>'}</div>
      <div class="note">תוכנות אוטומטיות בהדלקה: ${H.startupCount}</div></div>
  </div>

  <div class="card"><h2>מגמה — עומס לאורך זמן</h2>
    <div class="legend"><span><i style="background:var(--s1)"></i>זיכרון %</span>
      <span><i style="background:var(--s2)"></i>מעבד %</span></div>
    <div id="chart"></div>
  </div>

  <div class="two">
    <div class="card"><h2>צרכני הזיכרון הגדולים</h2>
      <table><tr><th>תוכנה</th><th>זיכרון</th></tr>${ramRows}</table></div>
    <div class="card"><h2>צרכני המעבד הגדולים (מצטבר)</h2>
      <table><tr><th>תוכנה</th><th>זמן מעבד</th></tr>${cpuRows}</table></div>
  </div>

  <footer>תחזוקה אחרונה: ${H.lastMaintenance||'טרם רצה'} ·
    בדיקה אוטומטית כל 4 שעות · תחזוקה בכל יום ראשון 09:00 ·
    רענן את הדף (F5) לאחר בדיקה חדשה</footer>`;

  // trend chart: two thin lines over the recorded history (inline SVG)
  (function(){
    const hist=(H.history||[]).filter(h=>h.ram!=null);
    const el=document.getElementById('chart');
    if(hist.length<2){el.innerHTML='<div class="sub">הגרף ייבנה אחרי כמה בדיקות (נאספת נקודה כל 4 שעות).</div>';return;}
    const W=el.clientWidth||900,Ht=140,P=8;
    const x=i=>P+(W-2*P)*(hist.length===1?0:i/(hist.length-1));
    const y=v=>Ht-P-(Ht-2*P)*(v/100);
    const path=k=>hist.map((h,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(h[k]).toFixed(1)).join(' ');
    const gy=[0,25,50,75,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${W-P+2}" y="${y(v)+4}" font-size="10" fill="var(--muted)">${v}</text>`).join('');
    el.innerHTML=`<svg width="100%" viewBox="0 0 ${W+26} ${Ht}" style="direction:ltr">${gy}
      <path d="${path('ram')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
      <path d="${path('cpu')}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <div class="sub" style="display:flex;justify-content:space-between;direction:ltr">
      <span>${hist[0].t}</span><span>${hist[hist.length-1].t}</span></div>`;
  })();
}
</script>
</body>
</html>
