const ICO={"אקסל":"📊","אקסל (ישן)":"📊","CSV":"📑","Word":"📝","PDF":"📕","HTML":"🌐","Markdown":"📄","JSON":"🔧","תמונה":"🖼️"};
const $=s=>document.querySelector(s);
let activeCat="", activeType="", sortBy="cat";
// stats
const byCat={}; DATA.forEach(r=>byCat[r.catLabel]=(byCat[r.catLabel]||0)+1);
$("#stats").innerHTML=Object.entries(byCat).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
// cat chips
const cats=[...new Set(DATA.map(r=>r.catLabel))];
$("#cats").innerHTML=`<span class="chip on" data-c="">הכל (${DATA.length})</span>`+cats.map(c=>`<span class="chip" data-c="${c}">${c} (${byCat[c]})</span>`).join("");
$("#cats").querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{activeCat=ch.dataset.c;$("#cats").querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));ch.classList.add("on");render();});
// type options
[...new Set(DATA.map(r=>r.type))].sort().forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;$("#ftype").appendChild(o);});
$("#ftype").onchange=e=>{activeType=e.target.value;render();};
$("#sort").onchange=e=>{sortBy=e.target.value;render();};
$("#q").oninput=render;
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hl(s,q){if(!q)return esc(s);try{return esc(s).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");}catch(e){return esc(s);}}
function fmt(b){return b>=1048576?(b/1048576).toFixed(1)+" MB":b>=1024?Math.round(b/1024)+" KB":b+" B";}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  let res=DATA.filter(r=>{
    if(activeCat&&r.catLabel!==activeCat)return false;
    if(activeType&&r.type!==activeType)return false;
    if(q){const h=(r.name+" "+r.desc+" "+r.folder+" "+r.type).toLowerCase();if(!q.split(/\s+/).every(t=>h.includes(t)))return false;}
    return true;
  });
  res.sort((a,b)=>{
    if(sortBy==="date")return b.date.localeCompare(a.date);
    if(sortBy==="name")return a.name.localeCompare(b.name,"he");
    if(sortBy==="size")return b.size-a.size;
    return a.cat.localeCompare(b.cat)||a.path.localeCompare(b.path);
  });
  $("#count").textContent=`מציג ${res.length} מתוך ${DATA.length} קבצים`;
  if(!res.length){$("#results").innerHTML='<div class="empty">לא נמצאו קבצים תואמים 🤷</div>';return;}
  $("#results").innerHTML=res.map(r=>{
    const arc=r.cat.startsWith("99"), live=r.cat.startsWith("אישי");
    const badgeCls=arc?"arc":live?"live":"cat";
    return `<div class="card">
      <div class="ico">${ICO[r.type]||"📁"}</div>
      <div class="body">
        <div class="name"><a href="./${encodeURI(r.path)}" target="_blank">${hl(r.name,q)}</a></div>
        <div class="desc">${hl(r.desc,q)}</div>
        <div class="meta">
          <span class="badge ${badgeCls}">${r.catLabel}</span>
          <span class="badge">${r.type}</span>
          <span class="badge">📅 ${r.date}</span>
          <span class="badge">${fmt(r.size)}</span>
          <span class="badge" style="color:#94a3b8">📁 ${hl(r.folder,q)}</span>
          <button class="cpy" onclick="navigator.clipboard.writeText(this.dataset.p);this.textContent='הועתק ✓'" data-p="${esc(r.path)}">העתק נתיב</button>
        </div>
        <div class="path">${esc(r.path)}</div>
      </div>
    </div>`;
  }).join("");
}
render();
