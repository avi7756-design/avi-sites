function m(n){return n<=0?'':'₪'+n.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});}

function filter(){

 var fe=document.getElementById('fe').value;
 var ft=document.getElementById('ft').value;
 var fs=document.getElementById('fs').value;
 var rows=D.filter(function(r){
  return (!fi||r.v===fi)&&(!fe||r.e===fe)&&(!ft||r.t===ft)&&(!fs||r.s===fs);
 });
 render(rows);
}

function render(rows){
 var tb=document.getElementById('tb');
 tb.innerHTML='';
 if(!rows||rows.length===0){
  var tr=document.createElement('tr');
  tr.innerHTML='<td colspan="12" style="padding:30px;text-align:center;color:#94a3b8;">לא נמצאו תוצאות לפי הסינון שנבחר</td>';
  tb.appendChild(tr);
  document.getElementById('sr').textContent='0';
  document.getElementById('sh').textContent='0h';
  document.getElementById('sa').textContent='₪0';
  return;
 }
 var grp={};
 for(var i=0;i<rows.length;i++){
  var r=rows[i];
  if(!grp[r.v])grp[r.v]=[];
  grp[r.v].push(r);
 }
 var ord=['1243','2543','2614'];
 var idx=1,th=0,ta=0;
 for(var o=0;o<ord.length;o++){
  var v=ord[o];
  if(!grp[v])continue;
  var sh=document.createElement('tr');
  sh.className='sec-head';
  sh.innerHTML='<td colspan="12">📋 '+IL[v]+'</td>';
  tb.appendChild(sh);
  var ih=0,ia=0;
  var gr=grp[v];
  for(var j=0;j<gr.length;j++){
   var r=gr[j];
   var amt=r.s==='charged'?r.q*r.p:0;
   ih+=r.q; th+=r.q;
   if(amt>0){ia+=amt;ta+=amt;}
   var tr=document.createElement('tr');
   if(r.t==='306/13')tr.className='row-13';
   var tc=r.t==='306/13'?'badge-13':'badge-tik';
   var ac=amt>0?'<td class="amt">'+m(amt)+'</td>':'<td class="amt-zero">ללא חיוב</td>';
   var txid=r.v+'-'+(String(j+1).padStart(2,'0'));
   tr.innerHTML='<td class="num">'+idx+'</td>'+'<td style="font-size:10px;font-weight:700;color:#6b21a8;white-space:nowrap;font-family:monospace;">'+txid+'</td>'+
    '<td><span class="badge-inv">'+r.v+'</span></td>'+
    '<td style="font-size:11px;white-space:nowrap;">'+r.d+'</td>'+
    '<td><span class="'+tc+'">'+r.t+'</span></td>'+
    '<td><span class="'+EC[r.e]+'">'+r.n+'</span></td>'+
    '<td class="desc">'+r.x+'</td>'+
    '<td>'+r.u+'</td>'+
    '<td style="font-weight:600;">'+r.q+'</td>'+
    '<td style="font-size:11px;">'+(r.p>0?'₪'+r.p:'-')+'</td>'+
    '<td>'+(r.s==='charged'?'<span class="type-charged">שכ"ט</span>':'<span class="type-free">ללא</span>')+'</td>'+
    ac;
   tb.appendChild(tr);
   idx++;

  st.className='subtotal';
  st.innerHTML='<td colspan="8" style="text-align:right;padding-right:16px;">סה"כ חשבון '+v+'</td>'+
