async function deriveKey(password, saltB64) {
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256"},
    baseKey,
    {name: "AES-GCM", length: 256},
    false,
    ["decrypt"]
  );
}

function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function tryDecrypt() {
  const pw = document.getElementById("pw").value;
  const errEl = document.getElementById("err");
  errEl.textContent = "";
  try {
    const key = await deriveKey(pw, PAYLOAD.salt);
    const iv = b64ToBytes(PAYLOAD.iv);
    const ct = b64ToBytes(PAYLOAD.ciphertext);
    const plainBuf = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, ct);
    const html = new TextDecoder().decode(plainBuf);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    errEl.textContent = "סיסמה שגויה או קובץ פגום.";
  }
}

document.getElementById("go").addEventListener("click", tryDecrypt);
document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") tryDecrypt();
});
</script>
