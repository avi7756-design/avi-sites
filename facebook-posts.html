<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#0a1628;color:#e8e8e8;min-height:100vh;line-height:1.7}
::selection{background:#d4af37;color:#0a1628}
.container{max-width:900px;margin:0 auto;padding:20px 16px 60px}

/* Header */
.header{text-align:center;padding:48px 20px 36px;position:relative}
.header::after{content:'';display:block;width:80px;height:3px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:24px auto 0}
.header h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;color:#fff;margin-bottom:8px}
.header .subtitle{font-size:1rem;color:#d4af37;font-weight:500;letter-spacing:0.5px}
.header .count-badge{display:inline-block;background:linear-gradient(135deg,#d4af37,#b8962e);color:#0a1628;font-weight:700;font-size:0.85rem;padding:4px 14px;border-radius:20px;margin-top:12px}

/* Top actions */
.top-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:none;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.25s ease}
.btn-gold{background:linear-gradient(135deg,#d4af37,#b8962e);color:#0a1628}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,175,55,0.35)}
.btn-outline{background:transparent;border:2px solid #d4af37;color:#d4af37}
.btn-outline:hover{background:#d4af37;color:#0a1628;transform:translateY(-2px)}
.btn svg{width:18px;height:18px;fill:currentColor}

/* Cards */
.cards{display:flex;flex-direction:column;gap:24px}
.card{background:linear-gradient(145deg,#111e35,#0e1a2e);border:1px solid rgba(212,175,55,0.15);border-radius:16px;overflow:hidden;transition:all 0.3s ease}
.card:hover{border-color:rgba(212,175,55,0.4);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(212,175,55,0.06);border-bottom:1px solid rgba(212,175,55,0.1)}
.card-number{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:linear-gradient(135deg,#d4af37,#b8962e);color:#0a1628;font-weight:800;font-size:0.9rem;border-radius:50%;flex-shrink:0}
.card-title{font-size:1rem;font-weight:700;color:#d4af37;flex:1;margin:0 14px}
.copy-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:1.5px solid rgba(212,175,55,0.4);background:transparent;color:#d4af37;border-radius:8px;font-family:'Heebo',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.25s ease;white-space:nowrap}
.copy-btn:hover{background:#d4af37;color:#0a1628;border-color:#d4af37}
.copy-btn.copied{background:#27ae60;border-color:#27ae60;color:#fff}
.copy-btn svg{width:15px;height:15px;fill:currentColor}
.card-body{padding:20px 24px 24px}
.card-body .post-text{white-space:pre-wrap;font-size:0.95rem;line-height:1.85;color:#d0d0d0}
.card-body .post-meta{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);font-size:0.8rem;color:#7a8a9e;font-style:italic}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#27ae60;color:#fff;padding:12px 28px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:600;font-size:0.9rem;opacity:0;transition:all 0.35s ease;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Footer */
.footer{text-align:center;margin-top:48px;padding-top:24px;border-top:1px solid rgba(212,175,55,0.1);color:#5a6a7e;font-size:0.8rem}

/* Responsive */
@media(max-width:600px){
  .container{padding:12px 10px 40px}
  .header{padding:32px 12px 24px}
  .card-header{padding:12px 16px;flex-wrap:wrap;gap:8px}
  .card-title{font-size:0.9rem;margin:0 10px}
  .card-body{padding:16px}
  .card-body .post-text{font-size:0.9rem}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = posts.map((p, i) => `

      <div class="card-header">
        <div class="card-number">${p.id}</div>
        <div class="card-title">${escapeHtml(p.file)}</div>

}

  const text = posts[index].text + apartmentLink;

    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> הועתק!';

function copyAll() {
  const allText = posts.map(p => `=== ${p.file} ===\n\n${p.text}${apartmentLink}`).join('\n\n' + '='.repeat(50) + '\n\n');
  navigator.clipboard.writeText(allText).then(() => {
    showToast('כל 9 הפוסטים הועתקו בהצלחה!');
  });
}

function downloadAll() {
  const allText = posts.map(p => `=== ${p.file} ===\n\n${p.text}\n\n---\n${p.meta}`).join('\n\n' + '='.repeat(60) + '\n\n');
  const blob = new Blob(['﻿' + allText], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'פוסטים_לפייסבוק_אחי_אילת_5.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('הקובץ יורד כעת!');
}
