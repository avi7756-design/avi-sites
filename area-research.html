<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🗺️ מחקר אזור - קריות | אבי חזן</title>
<meta name="theme-color" content="#1d4f7c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מחקר אזור">
<style>
  :root{
    --ink:#0e1b2a; --bg:#eef3f8; --card:#fff; --line:#d6e2ee; --muted:#5a6b7d;
    --blue:#2c6ca5; --blue-d:#1d4f7c; --gold:#c9a25a; --green:#2e7d32; --red:#c0392b; --amber:#e08e0b; --purple:#7e57c2;
    --shadow:0 2px 12px rgba(28,60,90,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{background:var(--bg);color:var(--ink);line-height:1.55;padding:0 0 90px;-webkit-tap-highlight-color:transparent;}
  header{background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff;padding:18px 16px 14px;text-align:center;box-shadow:var(--shadow);}
  header h1{font-size:21px;} header p{font-size:12px;opacity:.9;margin-top:2px;}
  .wrap{max-width:840px;margin:0 auto;padding:14px;}
  .btn{border:none;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:bold;cursor:pointer;color:#fff;background:var(--blue);font-family:inherit;}
  .btn:active{transform:scale(.97);}
  .btn.sm{padding:6px 11px;font-size:12px;} .btn.gray{background:#7a8a9a;} .btn.green{background:var(--green);} .btn.red{background:var(--red);} .btn.purple{background:var(--purple);} .btn.wide{width:100%;margin-top:7px;}
  .bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  input,textarea{padding:9px;border:1px solid #c3d2e0;border-radius:9px;font-family:inherit;font-size:14px;background:#fff;width:100%;}
  .area{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow);border-right:5px solid var(--blue);}
  .area h3{font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .area .nums{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap;}
  .lvl{margin-top:10px;}
  .lvl b{font-size:12.5px;}
  .chip{display:inline-block;font-size:11px;font-weight:bold;padding:3px 9px;border-radius:20px;margin:3px 3px 0 0;}
  .chip.cat{background:#e6f4ea;color:var(--green);} .chip.risk{background:#fdeaea;color:var(--red);}
  .notes{font-size:12.5px;color:#41566b;background:var(--bg);border-radius:9px;padding:9px 11px;margin-top:9px;white-space:pre-wrap;}
  .upd{font-size:11px;color:var(--muted);margin-top:6px;}
  .arow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;padding:14px;overflow:auto;} .overlay.show{display:block;}
  .modal{max-width:560px;margin:18px auto;background:var(--card);border-radius:16px;padding:17px;box-shadow:0 12px 50px rgba(0,0,0,.35);}
  .modal h2{color:var(--blue-d);font-size:17px;margin-bottom:5px;}
  .modal .x{float:left;background:var(--red);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--muted);margin:8px 0 3px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .promptbox{background:#0e1b2a;color:#cfe0f0;border-radius:10px;padding:11px;font-size:12px;line-height:1.5;white-space:pre-wrap;margin-top:8px;max-height:220px;overflow:auto;}
  .hint{font-size:12px;color:var(--muted);background:#f4f8fc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px;}
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:12px;}
</style>
</head>
<body>
<header>
  <h1>🗺️ מחקר אזור - קריות</h1>
  <p>מנופי ערך וסיכונים לכל שכונה · עדכון חי דרך Perplexity</p>
</header>

<div class="wrap">
  <div class="hint">💡 לכל אזור: מחיר שוק, מנופי ערך (➕) וסיכונים (➖) ידועים. לחץ "🔎 פרומפט מחקר" לעדכון חי ב-Perplexity, והדבק את הממצאים. הנתונים אינדיקטיביים - אמת מול nadlan.gov.il.</div>
  <div class="bar"><button class="btn" onclick="openAdd()">➕ הוסף אזור</button><button class="btn gray" onclick="exportData()">📤 גיבוי</button></div>
  <div id="areas"></div>
  <footer>מחקר אזור · v1.0 · נשמר מקומית · אבי חזן</footer>
</div>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:11px 22px;border-radius:30px;font-weight:bold;opacity:0;transition:.3s;z-index:200">נשמר ✓</div>

<script>
var KEY='area_research_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function fmt(n){return Math.round(n||0).toLocaleString('he-IL');}
function esc(s){return (s||'').replace(/[<>&"]/g,function(c){return({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c];});}
function toast(t){var e=document.getElementById('toast');e.textContent=t||'נשמר ✓';e.style.opacity='1';setTimeout(function(){e.style.opacity='0';},1500);}
function fmtD(iso){if(!iso)return 'טרם עודכן';return new Date(iso).toLocaleDateString('he-IL');}

function seed(){
  var a=load();if(a)return a;
  a=[
    {id:uid(),name:'קריית ים',perSqm:13500,yieldStr:'4%-4.5% (הגבוה באזור)',cats:['מחירי כניסה נוחים','תשואה תזרימית גבוהה'],risks:['קרבה למפרץ חיפה - זיהום אוויר'],notes:'יעד אטרקטיבי לדירת השקעה תזרימית. לבדוק תוכניות תחבורה והתחדשות.',updatedAt:''},
    {id:uid(),name:'קריית אתא',perSqm:13000,yieldStr:'4%-4.5%',cats:['מחירי כניסה נמוכים','עתודות צמיחה'],risks:['עתודות קרקע - היצע עתידי'],notes:'תשואה גבוהה. לבדוק קצב בנייה חדשה שעלול ללחוץ מחירים.',updatedAt:''},
    {id:uid(),name:'קריית חיים',perSqm:15500,yieldStr:'~3.5%',cats:['קרבה לים','פוטנציאל השבחה'],risks:['קרבה למפרץ חיפה - זיהום','מבנים ישנים'],notes:'פוטנציאל התחדשות במבנים ישנים. לבדוק פינוי-בינוי ותמ"א.',updatedAt:''},
    {id:uid(),name:'קריית ביאליק',perSqm:16000,yieldStr:'~3.5%',cats:['פרויקטים יוקרתיים','התחדשות'],risks:['פערי מחיר בין חדש לישן'],notes:'דירות חדשות 1.7-2.2M. יד שנייה נמוך - לאימות לפי רחוב.',updatedAt:''},
    {id:uid(),name:'קריית מוצקין',perSqm:17500,yieldStr:'~3.5%',cats:['ביקוש יציב','מגדלים חדשים'],risks:['מחיר כניסה גבוה יחסית'],notes:'הכי יקר באזור (טווח 13,600-26,100). פוטנציאל השבחה במגדלים.',updatedAt:''}
  ];
  save(a);return a;
}
function getAreas(){return load()||seed();}

function render(){
  var a=getAreas();
  document.getElementById('areas').innerHTML=a.map(function(ar,i){
    var cats=(ar.cats||[]).map(function(c){return '<span class="chip cat">➕ '+esc(c)+'</span>';}).join('');
    var risks=(ar.risks||[]).map(function(c){return '<span class="chip risk">➖ '+esc(c)+'</span>';}).join('');
    return '<div class="area">'+
      '<h3>'+esc(ar.name)+' <button class="btn sm gray" onclick="openEdit('+i+')">✏️</button></h3>'+
      '<div class="nums"><span>💰 ~'+fmt(ar.perSqm)+' ₪/מ"ר</span><span>📈 תשואה '+esc(ar.yieldStr||'')+'</span></div>'+
      (cats?'<div class="lvl"><b style="color:var(--green)">מנופי ערך:</b><br>'+cats+'</div>':'')+
      (risks?'<div class="lvl"><b style="color:var(--red)">סיכונים:</b><br>'+risks+'</div>':'')+
      (ar.notes?'<div class="notes">'+esc(ar.notes)+'</div>':'')+
      '<div class="upd">🕒 עודכן: '+fmtD(ar.updatedAt)+'</div>'+
      '<div class="arow"><button class="btn sm purple" onclick="genPrompt('+i+')">🔎 פרומפט מחקר</button></div>'+
      '<div id="po'+i+'"></div>'+
    '</div>';
  }).join('');
}

function genPrompt(i){
  var ar=getAreas()[i];
  var p='בדוק לי כמומחה נדל"ן עבור '+ar.name+' (אזור הקריות, מפרץ חיפה). ענה עם מקורות ותאריכים:\n\n'+
    'מנופי ערך (העלאת שווי):\n1. רכבת קלה / מטרונית / תחנה מתוכננת.\n2. מתחמי פינוי-בינוי / תמ"א 38 מוכרזים או מתוכננים.\n3. שינויי תב"ע / הגדלת אחוזי בנייה.\n4. פרויקטי תעסוקה ותשתית.\n\n'+
    'סיכונים:\n5. זיהום אוויר / מפעלים פטרוכימיים במפרץ.\n6. עתודות קרקע גדולות שיגדילו היצע.\n7. בעיות תכנון/רישוי ידועות.\n\n'+
    'בנוסף: מה מחיר למ"ר העדכני ב'+ar.name+' לפי עסקאות אחרונות, ומה מגמת המחירים ב-12 החודשים האחרונים?\nסכם: פוטנציאל עליית ערך מול סיכון.';
  navigator.clipboard.writeText(p).then(function(){toast('הפרומפט הועתק!');});
  document.getElementById('po'+i).innerHTML='<div class="promptbox">'+esc(p)+'</div><a class="btn purple wide" href="https://www.perplexity.ai" target="_blank" style="text-align:center;text-decoration:none;display:block">🔗 פתח Perplexity והדבק</a><button class="btn sm wide gray" onclick="addFinding('+i+')">📝 הדבק כאן את הממצאים</button>';
}
function addFinding(i){
  var txt=prompt('הדבק את ממצאי המחקר מ-Perplexity (יתווסף להערות עם תאריך):');
  if(txt===null||!txt.trim())return;
  var a=getAreas();var ar=a[i];
  var stamp=new Date().toLocaleDateString('he-IL');
  ar.notes=(ar.notes?ar.notes+'\n\n':'')+'['+stamp+'] '+txt.trim();
  ar.updatedAt=new Date().toISOString();
  save(a);render();toast('הממצאים נשמרו ✓');
}

function openAdd(){form(null);}
function openEdit(i){form(i);}
function form(i){
  var a=getAreas();var ar=(i!==null)?a[i]:{name:'',perSqm:0,yieldStr:'',cats:[],risks:[],notes:''};
  document.getElementById('modal').innerHTML=
   '<button class="x" onclick="closeOv()">✕</button><h2>'+(i!==null?'✏️ עריכת אזור':'➕ אזור חדש')+'</h2>'+
   '<label>שם האזור/שכונה</label><input id="f_name" value="'+esc(ar.name)+'">'+
   '<div class="row2"><div><label>מחיר למ"ר (₪)</label><input id="f_persqm" type="number" inputmode="numeric" value="'+(ar.perSqm||'')+'"></div><div><label>תשואה</label><input id="f_yield" value="'+esc(ar.yieldStr||'')+'" placeholder="~4%"></div></div>'+
   '<label>מנופי ערך (מופרד בפסיקים)</label><input id="f_cats" value="'+esc((ar.cats||[]).join(', '))+'" placeholder="רכבת קלה, התחדשות">'+
   '<label>סיכונים (מופרד בפסיקים)</label><input id="f_risks" value="'+esc((ar.risks||[]).join(', '))+'" placeholder="זיהום, עודף היצע">'+
   '<label>הערות / ממצאי מחקר</label><textarea id="f_notes" style="min-height:80px">'+esc(ar.notes||'')+'</textarea>'+
   '<button class="btn wide" onclick="saveArea('+(i!==null?i:'-1')+')">💾 שמור</button>'+
   (i!==null?'<button class="btn red wide" onclick="delArea('+i+')">🗑️ מחק</button>':'');
  document.getElementById('ov').classList.add('show');
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function splitList(s){return (s||'').split(',').map(function(x){return x.trim();}).filter(Boolean);}
function saveArea(i){
  var a=getAreas();
  var ar={id:(i>-1&&a[i])?a[i].id:uid(),name:val('f_name')||'אזור',perSqm:+val('f_persqm')||0,yieldStr:val('f_yield'),
    cats:splitList(val('f_cats')),risks:splitList(val('f_risks')),notes:val('f_notes'),
    updatedAt:(i>-1&&a[i])?a[i].updatedAt:''};
  if(i>-1)a[i]=ar;else a.push(ar);
  save(a);closeOv();render();toast();
}
function delArea(i){if(!confirm('למחוק את האזור?'))return;var a=getAreas();a.splice(i,1);save(a);closeOv();render();}
function closeOv(){document.getElementById('ov').classList.remove('show');}
function exportData(){var d=localStorage.getItem(KEY)||'[]';var b=new Blob([d],{type:'application/json'});var u=URL.createObjectURL(b);var el=document.createElement('a');el.href=u;el.download='area_research_'+new Date().toISOString().slice(0,10)+'.json';el.click();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeOv();});
seed();render();
</script>
<script src="nav.js"></script>
<script src="help.js"></script>
</body>
</html>
