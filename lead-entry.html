<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📥 רישום ליד מהיר - אחי אילת 5</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#2c2c2a;--muted:#6b6b66;--accent:#c1764c;--green:#2e7d32;--line:#e3ddd0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);padding:16px 16px 80px;line-height:1.5;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:22px;color:var(--accent);text-align:center;margin-bottom:4px;}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  label{display:block;font-weight:bold;font-size:15px;margin-bottom:8px;}
  input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;font-family:inherit;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{flex:1;min-width:90px;padding:12px 8px;text-align:center;background:#faf7f0;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:bold;color:var(--muted);transition:.12s;user-select:none;}
  .opt:hover{border-color:var(--accent);}
  .opt.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
  .opt.g.sel{background:var(--green);border-color:var(--green);}
  .save{width:100%;padding:16px;font-size:18px;font-weight:bold;background:var(--green);color:#fff;border:none;border-radius:12px;cursor:pointer;margin-top:6px;}
  .save:disabled{background:#bbb;cursor:not-allowed;}
  .msg{text-align:center;padding:12px;border-radius:10px;margin-top:12px;font-weight:bold;display:none;}
  .msg.ok{background:#e6f4ea;color:var(--green);display:block;}
  .msg.err{background:#fdeaea;color:#c0392b;display:block;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📥 רישום ליד מהיר</h1>
  <div class="sub">דירה אחי אילת 5 · לוחץ, לא מקליד · נכנס אוטומטית למערכת</div>

  <div class="card">
    <label>👤 שם (אופציונלי)</label>
    <input id="name" placeholder="שם הפונה">
    <label style="margin-top:14px;">📞 טלפון</label>
    <input id="phone" placeholder="050-0000000" inputmode="tel">
  </div>

  <div class="card">
    <label>📍 מאיפה הגיע הליד?</label>
    <div class="opts" id="source">
      <div class="opt" data-v="יד2">יד2</div>
      <div class="opt" data-v="Meta Ads">Meta Ads</div>
      <div class="opt" data-v="פייסבוק קבוצות">פייסבוק</div>
      <div class="opt" data-v="עמוד נחיתה">עמוד נחיתה</div>
      <div class="opt" data-v="לוחות">לוחות</div>
      <div class="opt" data-v="המלצה/אחר">אחר</div>
    </div>
  </div>

  <div class="card">
    <label>🏷️ סטטוס</label>
    <div class="opts" id="status">
      <div class="opt" data-v="פנייה חדשה">חדש</div>
      <div class="opt" data-v="דיברנו">דיברנו</div>
      <div class="opt" data-v="ביקור נקבע">ביקור נקבע</div>
      <div class="opt" data-v="ביקר">ביקר</div>
      <div class="opt" data-v="מעוניין">מעוניין</div>
      <div class="opt" data-v="לא מתאים">לא מתאים</div>
    </div>
  </div>

  <div class="card">
    <label>⭐ פוטנציאל</label>
    <div class="opts" id="potential">
      <div class="opt g" data-v="גבוה">🔥 גבוה</div>
      <div class="opt g" data-v="בינוני">בינוני</div>
      <div class="opt g" data-v="נמוך">נמוך</div>
    </div>
    <div class="hint">גבוה = יחיד/זוג, צריך מיידי. נמוך = מחפש מחיר/3 חדרים.</div>
  </div>

  <div class="card">
    <label>📝 הערה (אופציונלי)</label>
    <input id="notes" placeholder="למשל: מתגרש, צריך להיכנס ב-1 לחודש">
  </div>

  <button class="save" id="saveBtn" onclick="save()">💾 שמור ליד</button>
  <div class="msg" id="msg"></div>
</div>
<nav style="position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--accent);box-shadow:0 -2px 12px rgba(0,0,0,.25);padding:0 0 env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 1fr;">
  <a href="manage.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;color:#fff;text-decoration:none;font-size:12px;font-weight:bold;"><span style="font-size:22px">🏠</span>מסך ראשי</a>
  <a href="lead-entry.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;color:#fff;text-decoration:none;font-size:12px;font-weight:bold;background:rgba(255,255,255,.15);"><span style="font-size:22px">📥</span>ליד חדש</a>
  <a href="https://t.me/Avi_eilat5_bot" target="_blank" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;color:#fff;text-decoration:none;font-size:12px;font-weight:bold;"><span style="font-size:22px">🤖</span>בוט טלגרם</a>
</nav>

<script>
  const WEBHOOK = 'https://avi-hazan.app.n8n.cloud/webhook/new-lead-eilat5';
  const picks = { source:'', status:'', potential:'' };
  document.querySelectorAll('.opts').forEach(group=>{
    group.querySelectorAll('.opt').forEach(o=>{
      o.onclick=()=>{
        group.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        o.classList.add('sel');
        picks[group.id]=o.dataset.v;
      };
    });
  });
  function save(){
    const phone=document.getElementById('phone').value.trim();
    const msg=document.getElementById('msg');
    if(!phone){ msg.className='msg err'; msg.textContent='⚠️ חסר טלפון'; return; }
    if(!picks.source||!picks.status){ msg.className='msg err'; msg.textContent='⚠️ בחר מקור וסטטוס'; return; }
    const btn=document.getElementById('saveBtn');
    btn.disabled=true; btn.textContent='שומר...';
    const payload={
      date:new Date().toISOString().slice(0,10),
      name:document.getElementById('name').value.trim(),
      phone:phone, source:picks.source, status:picks.status,
      potential:picks.potential||'בינוני',
      notes:document.getElementById('notes').value.trim()
    };
    fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(r=>{ if(!r.ok) throw new Error(); msg.className='msg ok'; msg.textContent='✅ הליד נשמר במערכת!';
        document.querySelectorAll('input').forEach(i=>i.value='');
        document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
        picks.source=picks.status=picks.potential='';
      })
      .catch(()=>{ msg.className='msg err'; msg.textContent='❌ שגיאה - בדוק חיבור'; })
      .finally(()=>{ btn.disabled=false; btn.textContent='💾 שמור ליד'; });
  }
</script>
<footer style="font-size:10px;color:#999;text-align:center;padding:10px 0;">גרסה <span id="siteVer"></span></footer>
<script src="version.js"></script>
<script>(function(){if(window.SITE_VERSION){document.getElementById('siteVer').textContent=SITE_VERSION.num+' · '+SITE_VERSION.date+' '+SITE_VERSION.time;}})();</script>
<script src="nav.js"></script>
<script src="help.js"></script>
</body>
</html>
