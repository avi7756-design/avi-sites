let dupOnly=false, showArc=false;
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const fld=document.getElementById('fld').value, ext=document.getElementById('ext').value;
 let r=D.filter(f=>{
  if(!showArc&&f.status==='archive')return false;
  if(dupOnly&&f.status!=='dup')return false;
  if(fld&&f.folder!==fld)return false;
  if(ext&&f.ext!==ext)return false;
  if(q){const h=(f.name+' '+f.folder+' '+f.rel).toLowerCase();if(!h.includes(q))return false;}
  return true;});
 document.getElementById('inf').textContent=`מציג ${r.length} / ${D.length} קבצים${q?' | חיפוש: "'+q+'"':''}${dupOnly?' | כפולים בלבד':''}`;
 if(!r.length){document.getElementById('out').innerHTML='<div class="empty">🔮 לא נמצאו קבצים</div>';return;}
 const groups={}; r.forEach(f=>{(groups[f.folder]=groups[f.folder]||[]).push(f)});
 let html='';
 ORDER.forEach(k=>{ if(!groups[k])return; const g=groups[k]; const fc=g[0].folder_color;
  html+=`<div class="section" style="color:${fc}">${g[0].folder_label}<span class="section-badge" style="color:${fc}">${g.length}</span></div><div class="grid">`;
  g.forEach(f=>{
   const db=f.status==='dup'?'<span class="bdg b-dup">כפול</span>':'';
   const ab=f.status==='archive'?'<span class="bdg b-arc">ארכיון</span>':'';
   const dof=f.status==='dup'?`<div class="dupof">↳ עותק של: ${f.canon}</div>`:'';
   html+=`<div class="card ${f.status==='dup'?'is-dup':''} ${f.status==='archive'?'is-arc':''}">
   <div class="card-folder" style="color:${f.folder_color}">${f.folder_label}</div>
   <div class="card-name"><span style="font-size:20px;float:right;margin-left:8px">${f.icon}</span>${db}${ab}<a href="computer://${f.wp}" title="${f.rel}">${f.name}</a></div>
   ${dof}<div class="card-meta"><span>${f.date}</span><span>${f.size}</span></div></div>`;});
  html+='</div>';});
 document.getElementById('out').innerHTML=html;}
function toggleDup(){dupOnly=!dupOnly;document.getElementById('db').classList.toggle('on',dupOnly);render();}
