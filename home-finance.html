async function tryPw(pw){
  const raw=Uint8Array.from(atob(B),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),nonce=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},key,ct);
}
function show(html){
  const f=document.getElementById('view');
  document.getElementById('card').style.display='none';
  f.style.display='block';
  try{f.srcdoc=html;}
  catch(e){const b=new Blob([html],{type:'text/html'});f.src=URL.createObjectURL(b);}
}
async function go(){
 const typed=document.getElementById('pw').value;
 const clean=typed.toUpperCase().replace(/[^A-Z0-9]/g,'');
 const cands=[...new Set([typed.trim(), clean, clean.length===8?clean.slice(0,4)+'-'+clean.slice(4):clean])];
 document.getElementById('err').style.display='none';
 document.getElementById('wait').style.display='block';
 document.getElementById('btn').disabled=true;
 await new Promise(r=>setTimeout(r,50));
 for(const c of cands){
  try{
   const pt=await tryPw(c);
   show(new TextDecoder().decode(pt));
   return;
  }catch(e){}
 }
 document.getElementById('wait').style.display='none';
 document.getElementById('btn').disabled=false;
 document.getElementById('err').style.display='block';}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script></body></html>
