  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
};
const link = (url, text) => {
  if (typeof url !== 'string' || !url.startsWith('https://')) return null;
  const a = el('a', '', text);
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  return a;
};
const stars = n => {
  const k = Math.max(0, Math.min(5, Math.round(Number(n) || 0)));
  return '★'.repeat(k) + '☆'.repeat(5 - k);
};

  if (item.best_store) {
    const meta = el('div', 'meta', item.best_store + ' · ');

    if (a) meta.append(a);
    card.append(meta);
  }
  if (item.note) card.append(el('div', 'meta', item.note));

  const options = Array.isArray(item.options) ? item.options : [];
  if (options.length > 0) {
    const det = el('details');
    det.append(el('summary', '', options.length + ' חלופות שנבדקו'));
    for (const o of options) {
      const box = el('div', 'opt');
      const r = el('div', 'row');
      r.append(el('span', 'name', o.name));
      r.append(el('span', 'price', ils(o.price)));
      box.append(r);
      const m = el('div', 'meta');
      m.append(el('span', 'stars', stars(o.value)));
      m.append(document.createTextNode(' · ' + (o.store || '')));
      if (typeof o.rating === 'number') m.append(document.createTextNode(' · דירוג קונים ' + o.rating));

    }

  watchBox.append(card);
}

const helpRender = () => {
  const pg = HELP[helpAt];
  gid('help-step').textContent = 'עמוד ' + (helpAt + 1) + ' מתוך ' + HELP.length;
  gid('help-title').textContent = pg.t;
  const body = gid('help-body'); body.textContent = '';
  for (const t of pg.p) body.append(el('p', '', t));
  if (pg.s.length) { const ol = el('ol'); for (const t of pg.s) ol.append(el('li', '', t)); body.append(ol); }
  gid('help-prev').disabled = helpAt === 0;
  gid('help-next').textContent = helpAt === HELP.length - 1 ? 'סיום' : 'הבא';
  const dots = gid('help-dots'); dots.textContent = '';
  HELP.forEach((x, i) => {
    const d = el('button', 'dot'); d.type = 'button';
    d.setAttribute('aria-label', 'עמוד ' + (i + 1) + ': ' + x.t);
    d.setAttribute('aria-current', i === helpAt ? 'true' : 'false');
    d.addEventListener('click', () => { helpAt = i; helpRender(); });
    dots.append(d);
  });
};
const helpOpen = () => {
  if (!gid('help').hidden) return;
  helpFrom = document.activeElement; helpAt = 0; helpRender();
  gid('help').hidden = false; gid('help-title').focus();
};
const helpClose = () => { gid('help').hidden = true; if (helpFrom && helpFrom.focus) helpFrom.focus(); };
const goHome = () => { helpClose(); window.scrollTo(0, 0); };
const helpStep = n => {
  const to = helpAt + n;
  if (to >= HELP.length) { goHome(); return; }
  if (to < 0) return;
  helpAt = to; helpRender();
};
gid('help-open').addEventListener('click', helpOpen);
gid('help-close').addEventListener('click', helpClose);
gid('help-home').addEventListener('click', goHome);
gid('help-prev').addEventListener('click', () => helpStep(-1));
gid('help-next').addEventListener('click', () => helpStep(1));
gid('help').addEventListener('click', e => { if (e.target === gid('help')) helpClose(); });
document.addEventListener('keydown', e => {
  if (e.key === 'F1') { e.preventDefault(); if (gid('help').hidden) helpOpen(); else helpClose(); return; }
  if (gid('help').hidden) return;
  if (e.key === 'Escape') helpClose();
  else if (e.key === 'ArrowLeft') helpStep(1);
  else if (e.key === 'ArrowRight') helpStep(-1);
});
</script>
</body>
</html>
